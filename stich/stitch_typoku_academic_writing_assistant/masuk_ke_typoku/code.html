<script>
  (function initPasswordToggle() {
    const toggleBtn = document.getElementById('toggle-pwd-btn');
    const pwdInput = document.getElementById('account-password');
    const pwdIcon = document.getElementById('pwd-icon');

    if (!toggleBtn || !pwdInput || !pwdIcon) return;

    toggleBtn.addEventListener('click', function() {
      const isPassword = pwdInput.getAttribute('type') === 'password';
      if (isPassword) {
        pwdInput.setAttribute('type', 'text');
        pwdIcon.textContent = 'visibility_off';
      } else {
        pwdInput.setAttribute('type', 'password');
        pwdIcon.textContent = 'visibility';
      }
    });
  })();
