eHeight": "1.3", "letterSpacing": "-0.02em", "fontWeight": "700" } ], "body-editor": [ "16px", { "lineHeight": "1.75", "letterSpacing": "0", "fontWeight": "400" } ], "caption": [ "12px", { "lineHeight": "1.4", "letterSpacing": "0.01em", "fontWeight": "500" } ] } } } };</script></head><body class="bg-bg-page font-body-regular text-body-regular text-on-surface min-h-screen flex flex-col justify-between selection:bg-primary-fixed selection:text-on-primary-fixed"><header class="w-full pt-space-xl pb-space-md flex justify-center"></header><main class="w-full flex-1 flex flex-col justify-center items-center px-space-md py-space-lg"><div class="flex flex-col w-full items-center justify-center py-space-sm">
<!-- Subtle Ambient Glow -->
<div class="relative w-full max-w-[520px]">
<div class="absolute -top-10 -left-10 w-72 h-72 bg-primary-fixed/30 rounded-full blur-3xl pointer-events-none -z-10"></div>
<div class="absolute -bottom-10 -right-10 w-72 h-72 bg-secondary-container/20 rounded-full blur-3xl pointer-events-none -z-10"></div>
<!-- Free Perk Banner -->

<!-- Main Registration Card -->
<div class="w-full bg-surface rounded-xl shadow-md p-space-md sm:p-space-xl">
<!-- Header -->
<div class="text-center mb-space-lg">
<div class="inline-flex items-center justify-center w-12 h-12 rounded-xl bg-primary text-on-primary shadow-sm mb-space-sm">
<span class="material-symbols-outlined text-[28px]">spellcheck</span>
</div>
<h1 class="font-headline-md text-headline-md text-on-surface font-bold tracking-tight">Daftar Akun TypoKu</h1>
<p class="font-body-regular text-body-medium text-text-secondary mt-space-xs">
          Mulai koreksi PUEBI, parafrase naskah, dan cek ejaan gratis
        </p>
</div>
<!-- Quick SSO Buttons -->

<!-- Divider -->

<!-- Registration Form -->
<form class="flex flex-col gap-space-md" onsubmit="event.preventDefault();"><!-- Nama Lengkap Field -->
<div class="flex flex-col gap-space-xs">
  <label class="font-label-md text-label-md text-on-surface font-semibold" for="reg-fullname">
    Nama Lengkap
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-space-md text-text-muted text-[20px] pointer-events-none">badge</span>
    <input class="w-full h-11 pl-11 pr-space-md rounded-lg bg-surface text-on-surface font-body-regular text-body-medium shadow-xs placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-secondary-container" id="reg-fullname" placeholder="cth. Fadhil Ardian" required="" type="text">
  </div>
</div>

<!-- Email Field -->
<div class="flex flex-col gap-space-xs">
  <label class="font-label-md text-label-md text-on-surface font-semibold" for="reg-email">
    Email
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-space-md text-text-muted text-[20px] pointer-events-none">alternate_email</span>
    <input class="w-full h-11 pl-11 pr-space-md rounded-lg bg-surface text-on-surface font-body-regular text-body-medium shadow-xs placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-secondary-container" id="reg-email" placeholder="nama@domain.com" required="" type="email">
  </div>
</div>

<!-- Nomor Handphone / No HP Field -->
<div class="flex flex-col gap-space-xs">
  <label class="font-label-md text-label-md text-on-surface font-semibold" for="reg-phone">
    Nomor Handphone (No HP)
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-space-md text-text-muted text-[20px] pointer-events-none">call</span>
    <input class="w-full h-11 pl-11 pr-space-md rounded-lg bg-surface text-on-surface font-body-regular text-body-medium shadow-xs placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-secondary-container" id="reg-phone" placeholder="0812-3456-7890" required="" type="tel">
  </div>
</div>

<!-- Kata Sandi Field -->
<div class="flex flex-col gap-space-xs">
  <label class="font-label-md text-label-md text-on-surface font-semibold flex items-center justify-between" for="reg-password">
    <span class="">Kata Sandi</span>
    <span class="font-caption text-caption text-text-muted">Min. 8 karakter</span>
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-space-md text-text-muted text-[20px] pointer-events-none">lock</span>
    <input class="w-full h-11 pl-11 pr-11 rounded-lg bg-surface text-on-surface font-body-regular text-body-medium shadow-xs placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-secondary-container" id="reg-password" oninput="checkPasswordStrength(this.value)" placeholder="••••••••••••" required="" type="password">
    <button class="absolute right-space-md text-text-muted hover:text-on-surface transition-colors focus:outline-none" onclick="togglePasswordVisibility('reg-password', 'pwd-toggle-icon')" type="button">
      <span class="material-symbols-outlined text-[20px]" id="pwd-toggle-icon">visibility</span>
    </button>
  </div>
  <!-- Password Strength Indicator -->
  <div class="mt-1 flex flex-col gap-1">
    <div class="grid grid-cols-4 gap-1.5 h-1.5 w-full">
      <div class="rounded-full bg-status-success transition-all duration-300" id="bar-1"></div>
      <div class="rounded-full bg-status-success transition-all duration-300" id="bar-2"></div>
      <div class="rounded-full bg-status-success transition-all duration-300" id="bar-3"></div>
      <div class="rounded-full bg-surface-container-high transition-all duration-300" id="bar-4"></div>
    </div>
    <div class="flex items-center justify-between">
      <span class="font-caption text-caption text-text-muted">Kekuatan kata sandi:</span>
      <span class="font-caption text-caption font-semibold text-status-success" id="strength-label">Kuat</span>
    </div>
  </div>
</div>

<!-- Konfirmasi Kata Sandi Field -->
<div class="flex flex-col gap-space-xs">
  <label class="font-label-md text-label-md text-on-surface font-semibold" for="reg-password-confirm">
    Konfirmasi Kata Sandi
  </label>
  <div class="relative flex items-center">
    <span class="material-symbols-outlined absolute left-space-md text-text-muted text-[20px] pointer-events-none">lock_reset</span>
    <input class="w-full h-11 pl-11 pr-11 rounded-lg bg-surface text-on-surface font-body-regular text-body-medium shadow-xs placeholder:text-text-muted focus:outline-none focus:ring-2 focus:ring-secondary-container" id="reg-password-confirm" placeholder="Ulangi kata sandi" required="" type="password">
    <button class="absolute right-space-md text-text-muted hover:text-on-surface transition-colors focus:outline-none" onclick="togglePasswordVisibility('reg-password-confirm', 'pwd-confirm-toggle-icon')" type="button">
      <span class="material-symbols-outlined text-[20px]" id="pwd-confirm-toggle-icon">visibility</span>
    </button>
  </div>
</div>

<!-- Terms and Privacy Checkbox -->
<label class="flex items-start gap-space-sm cursor-pointer select-none mt-space-xs">
  <input checked="" class="mt-1 w-4 h-4 rounded text-primary focus:ring-primary-container accent-primary cursor-pointer shrink-0" required="" type="checkbox">
  <span class="font-caption text-caption text-text-secondary leading-snug">
    Saya menyetujui <a class="text-primary font-medium hover:underline" data-path="ketentuan-layanan" href="#">Ketentuan Layanan</a> dan <a class="text-primary font-medium hover:underline" data-path="kebijakan-privasi" href="#">Kebijakan Privasi</a> TypoKu.
  </span>
</label>

<!-- Submit Button -->
<button class="w-full py-3 px-space-md bg-primary hover:bg-primary-hover active:bg-on-primary-fixed-variant text-on-primary font-label-md text-label-md font-semibold rounded-lg shadow-md transition-all duration-150 flex items-center justify-center gap-space-sm group focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-secondary-container mt-space-xs" type="submit">
  <span class="">Buat Akun Gratis</span>
  <span class="material-symbols-outlined text-[20px] transition-transform duration-150 group-hover:translate-x-1">arrow_forward</span>
</button></form>
<!-- Security / Privacy Micro-Badge -->

<!-- Footer Sign-in Link -->
<div class="mt-space-md text-center">
<p class="font-body-regular text-body-medium text-text-secondary">
          Sudah punya akun? 
          <a class="text-primary font-semibold hover:text-primary-hover hover:underline transition-colors" data-path="masuk" href="#">
            Masuk di sini
          </a>
</p>
</div>
</div><p class="text-center font-caption text-caption text-text-muted mt-space-md" style="color: rgb(107, 114, 128);">© 2026 TypoKu. Hak Cipta Dilindungi Undang-Undang.</p>
</div>
</div>
<script>
  function selectRole(role) {
    const buttons = document.querySelectorAll('.role-pill');
    buttons.forEach(btn => {
      const isSelected = btn.getAttribute('data-role') === role;
      if (isSelected) {
        btn.classList.remove('bg-surface-container-lowest', 'text-text-secondary');
        btn.classList.add('bg-primary-light', 'text-primary', 'font-medium');
      } else {
        btn.classList.remove('bg-primary-light', 'text-primary', 'font-medium');
        btn.classList.add('bg-surface-container-lowest', 'text-text-secondary');
      }
    });
  }

  function togglePasswordVisibility(inputId, iconId) {
    const input = document.getElementById(inputId);
    const icon = document.getElementById(iconId);
    if (!input || !icon) return;

    if (input.type === 'password') {
      input.type = 'text';
      icon.textContent = 'visibility_off';
    } else {
      input.type = 'password';
      icon.textContent = 'visibility';
    }
  }

  function checkPasswordStrength(password) {
    const b1 = document.getElementById('bar-1');
    const b2 = document.getElementById('bar-2');
    const b3 = document.getElementById('bar-3');
    const b4 = document.getElementById('bar-4');
    const label = document.getElementById('strength-label');

    const defaultBg = 'bg-surface-container-high';
    [b1, b2, b3, b4].forEach(b => {
      b.className = `rounded-full ${defaultBg} transition-all duration-300`;
    });

    if (!password) {
      label.textContent = 'Kosong';
      label.className = 'font-caption text-caption font-semibold text-text-muted';
      return;
    }

    let score = 0;
    if (password.length >= 8) score++;
    if (/[A-Z]/.test(password)) score++;
    if (/[0-9]/.test(password)) score++;
    if (/[^A-Za-z0-9]/.test(password)) score++;

    if (score <= 1) {
      b1.className = 'rounded-full bg-status-error transition-all duration-300';
      label.textContent = 'Lemah';
      label.className = 'font-caption text-caption font-semibold text-status-error';
    } else if (score === 2) {
      b1.className = 'rounded-full bg-status-warning transition-all duration-300';
      b2.className = 'rounded-full bg-status-warning transition-all duration-300';
      label.textContent = 'Cukup';
      label.className = 'font-caption text-caption font-semibold text-status-warning';
    } else if (score === 3) {
      b1.className = 'rounded-full bg-status-success transition-all duration-300';
      b2.className = 'rounded-full bg-status-success transition-all duration-300';
      b3.className = 'rounded-full bg-status-success transition-all duration-300';
      label.textContent = 'Kuat';
      label.className = 'font-caption text-caption font-semibold text-status-success';
    } else {
      b1.className = 'rounded-full bg-status-success transition-all duration-300';
      b2.className = 'rounded-full bg-status-success transition-all duration-300';
      b3.className = 'rounded-full bg-status-success transition-all duration-300';
      b4.className = 'rounded-full bg-status-success transition-all duration-300';
      label.textContent = 'Sangat Kuat';
      label.className = 'font-caption text-caption font-semibold text-status-success';
    }
  }
</script></main>
