er":"#4f46e5","on-background":"#141b2b","on-tertiary-fixed-variant":"#7b2f00","primary-fixed":"#e2dfff","inverse-on-surface":"#edf0ff","inverse-surface":"#293040","surface-container-high":"#e1e8fd","tertiary":"#7e3000"},borderRadius:{DEFAULT:"0.25rem",lg:"0.5rem",xl:"0.75rem",full:"9999px"},spacing:{"space-xs":"0.25rem","space-lg":"1.5rem","margin-mobile":"1rem","gutter-mobile":"1rem",margin:"2rem","space-sm":"0.5rem","space-md":"1rem","space-xl":"2rem",gutter:"1.5rem"},fontFamily:{"headline-md":["Inter"],"label-sm":["Inter"],"label-md":["Inter"],"body-regular":["Inter"],"headline-lg":["Inter"],"display-mobile":["Inter"],"headline-lg-mobile":["Inter"],"headline-sm":["Inter"],caption:["Inter"],"body-editor":["Inter"],"body-medium":["Inter"],display:["Inter"]},fontSize:{"headline-md":["24px",{lineHeight:"1.4",letterSpacing:"-0.015em",fontWeight:"600"}],"label-sm":["12px",{lineHeight:"1.4",letterSpacing:"0.02em",fontWeight:"600"}],"label-md":["14px",{lineHeight:"1.4",letterSpacing:"0.01em",fontWeight:"600"}],"body-regular":["15px",{lineHeight:"1.6",letterSpacing:"0",fontWeight:"400"}],"headline-lg":["32px",{lineHeight:"1.3",letterSpacing:"-0.02em",fontWeight:"700"}],"display-mobile":["36px",{lineHeight:"1.25",letterSpacing:"-0.02em",fontWeight:"800"}],"headline-lg-mobile":["26px",{lineHeight:"1.35",letterSpacing:"-0.015em",fontWeight:"700"}],"headline-sm":["18px",{lineHeight:"1.5",letterSpacing:"-0.01em",fontWeight:"600"}],caption:["12px",{lineHeight:"1.4",letterSpacing:"0.01em",fontWeight:"500"}],"body-editor":["16px",{lineHeight:"1.75",letterSpacing:"0",fontWeight:"400"}],"body-medium":["14px",{lineHeight:"1.5",letterSpacing:"0.005em",fontWeight:"500"}],display:["48px",{lineHeight:"1.2",letterSpacing:"-0.025em",fontWeight:"800"}]}}}};</script></head><body class="min-h-screen bg-bg-page font-body-regular text-on-surface flex flex-col justify-between antialiased selection:bg-primary-light selection:text-primary"><div class="w-full flex-1 flex flex-col justify-center items-center px-gutter-mobile md:px-gutter py-space-xl"><main class="w-full max-w-md mx-auto flex flex-col items-center"><div class="flex flex-col w-full items-center justify-center">
<div class="w-full max-w-[440px] bg-white rounded-2xl border border-slate-200/80 shadow-xl shadow-indigo-950/5 p-8 sm:p-9 flex flex-col items-center relative">

<div class="text-center w-full mb-7"><h1 class="text-2xl font-bold text-gray-900 mb-2 tracking-tight">Lupa Kata Sandi?</h1><p class="text-sm text-gray-500 leading-relaxed max-w-sm mx-auto">Masukkan alamat email terdaftar (kampus atau pribadi). Kami akan mengirimkan tautan verifikasi pemulihan akses.</p></div>
<form class="w-full flex flex-col gap-5" id="reset-form" onsubmit="event.preventDefault(); handleSubmit();">
<div class="flex flex-col"><label class="text-sm font-semibold text-gray-700 mb-1.5 flex items-center justify-between" for="email"><span class="">Email Kampus / Akun</span></label><div class="relative flex items-center"><span class="material-symbols-outlined absolute left-3.5 text-gray-400 text-[20px] pointer-events-none select-none">mail</span><input autocomplete="email" class="w-full pl-10 pr-3.5 py-3 bg-white text-gray-900 text-sm border border-slate-200 rounded-xl shadow-sm outline-none transition-all duration-150 placeholder:text-gray-400 focus:border-indigo-500 focus:ring-4 focus:ring-indigo-100" id="email" name="email" placeholder="nama@kampus.ac.id atau email Anda" required="" type="email"></div></div>
<div class="hidden rounded-lg p-3 text-caption font-body-medium flex items-start gap-2" id="status-message"></div>
<button class="w-full bg-indigo-600 hover:bg-indigo-700 active:bg-indigo-800 text-white font-semibold text-sm py-3 px-4 rounded-xl flex items-center justify-center gap-2 shadow-md shadow-indigo-600/20 transition-all duration-150 cursor-pointer active:scale-[0.99]" id="submit-btn" type="submit">
<span class="">Kirim Tautan Pemulihan</span>

</button>
</form>
<div class="mt-6 pt-5 w-full border-t border-slate-100 flex items-center justify-center"><a class="inline-flex items-center gap-1.5 text-indigo-600 hover:text-indigo-700 font-medium text-sm transition-colors duration-150 group" href="#"><span class="material-symbols-outlined text-[18px] transition-transform duration-150 group-hover:-translate-x-0.5">arrow_back</span>Kembali ke Halaman Masuk</a></div>
</div>

<script>
    function handleSubmit() {
      const emailInput = document.getElementById('email');
      const submitBtn = document.getElementById('submit-btn');
      const statusMsg = document.getElementById('status-message');

      if (!emailInput.value) return;

      submitBtn.disabled = true;
      submitBtn.classList.add('opacity-70', 'cursor-not-allowed');
      submitBtn.innerHTML = `
        <span class="inline-block animate-spin material-symbols-outlined text-[18px]">progress_activity</span>
        <span>Mengirim Instruksi...</span>
      `;

      setTimeout(() => {
        statusMsg.className = "rounded-lg p-3.5 text-caption font-body-medium flex items-start gap-2 bg-status-success-bg text-status-success";
        statusMsg.innerHTML = `
          <span class="material-symbols-outlined text-[18px] shrink-0" style="font-variation-settings: 'FILL' 1;">check_circle</span>
          <span>Tautan instruksi pemulihan telah dikirim ke <strong>${emailInput.value}</strong>. Periksa folder kotak masuk atau spam Anda.</span>
        `;
        statusMsg.classList.remove('hidden');

        submitBtn.disabled = false;
        submitBtn.classList.remove('opacity-70', 'cursor-not-allowed');
        submitBtn.innerHTML = `
          <span>Kirim Ulang Tautan</span>
          <span class="material-symbols-outlined text-[18px]">sync</span>
        `;
      }, 1000);
    }
  </script>
</div><p class="text-xs text-slate-400 mt-6 text-center select-none font-medium"><span style="color: rgb(107, 114, 128); letter-spacing: 0.12px;" class="">© 2026 TypoKu. Hak Cipta Dilindungi Undang-Undang.</span></p></main></div>
